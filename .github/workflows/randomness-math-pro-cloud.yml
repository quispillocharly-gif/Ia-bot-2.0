name: Randomness Math Pro Cloud Learning
on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
permissions:
  contents: write
jobs:
  learn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Math Pro cloud learner
        run: python randomness-math-pro/learner.py
      - name: Save Math Pro cloud state
        run: |
          git config user.name "math-pro-bot"
          git config user.email "actions@users.noreply.github.com"
          git add randomness-math-pro/cloud-state.json
          git diff --cached --quiet || git commit -m "Update Math Pro cloud state"
          git pull --rebase
          git push
