name: TOPO AIROMEN - DIFFER Payout
on:
  workflow_dispatch:
  schedule:
    - cron: "2 * * * *"
permissions:
  contents: write
concurrency:
  group: topo-airomen-payout
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - run: pip install -r topo-airomen/requirements-ai.txt
      - run: python topo-airomen/payout_probe_differ.py
      - name: Persist payout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add topo-airomen/memory/differ_payout_snapshot.json
          git diff --cached --quiet || git commit -m "TOPO AIROMEN payout checkpoint"
          for attempt in 1 2 3; do git pull --rebase origin main; if git push; then break; fi; [ "$attempt" -eq 3 ] && exit 1; sleep 3; done
