name: TOPO AIROMEN - DIFFER Neural Research
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "topo-airomen/collect_ticks.py"
      - "topo-airomen/differ_train.py"
      - ".github/workflows/topo-airomen-train.yml"
  schedule:
    - cron: "7 */2 * * *"
permissions:
  contents: write
concurrency:
  group: topo-airomen-train
  cancel-in-progress: false
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r topo-airomen/requirements-ai.txt
      - name: Collect 10000 paginated ticks
        env:
          TICK_COUNT: "10000"
        run: python topo-airomen/collect_ticks.py
      - name: Train chronological DIFFER candidate
        run: python topo-airomen/differ_train.py
      - name: Persist neural candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add topo-airomen/memory/differ_train_latest.json topo-airomen/memory/differ_candidate.json topo-airomen/memory/differ_candidate.joblib
          git diff --cached --quiet || git commit -m "TOPO AIROMEN neural research"
          rm -f topo-airomen/ticks.json topo-airomen/audit.json
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 3
          done
