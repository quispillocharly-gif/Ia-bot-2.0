name: MATCH AI - V8 Prospective Challenger
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "v8_challenger.py"
      - ".github/workflows/match-v8-challenger.yml"
      - "requirements-ai.txt"
  schedule:
    - cron: "15,35,55 * * * *"
permissions:
  contents: write
concurrency:
  group: match-ai-v8-writer
  cancel-in-progress: false
jobs:
  challenger:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-ai.txt
      - name: Refresh audited ticks
        env:
          TICK_COUNT: "10000"
        run: python collect_ticks.py
      - name: Run V8 prospective challenger lab
        run: python v8_challenger.py
      - name: Persist V8 memory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add memory/v8_challenger_latest.json memory/v8_challenger_state.json memory/v8_frozen_neural.json memory/v8_frozen_neural.joblib
          git diff --cached --quiet || git commit -m "V8 prospective challenger research"
          git restore audit.json ticks.json
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 3
          done
