name: TOPO AIROMEN - DIFFER V2 Economic Lab
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "topo-airomen/differ_v2.py"
      - ".github/workflows/topo-airomen-v2.yml"
      - "topo-airomen/requirements-ai.txt"
  schedule:
    - cron: "18,38,58 * * * *"
permissions:
  contents: write
concurrency:
  group: topo-airomen-v2
  cancel-in-progress: false
jobs:
  v2:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r topo-airomen/requirements-ai.txt
      - name: Refresh DIFFER payout
        run: python topo-airomen/payout_probe_differ.py
      - name: Collect 10000 paginated ticks
        env:
          TICK_COUNT: "10000"
        run: python topo-airomen/collect_ticks.py
      - name: Run V2 economic ensemble forward lab
        run: python topo-airomen/differ_v2.py
      - name: Persist V2 state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add topo-airomen/memory/differ_payout_snapshot.json topo-airomen/memory/differ_v2_latest.json topo-airomen/memory/differ_v2_state.json topo-airomen/memory/differ_v2_frozen.json topo-airomen/memory/differ_v2_frozen.joblib
          [ ! -f topo-airomen/memory/differ_v2_graveyard.json ] || git add topo-airomen/memory/differ_v2_graveyard.json
          git diff --cached --quiet || git commit -m "TOPO AIROMEN V2 economic research"
          rm -f topo-airomen/ticks.json topo-airomen/audit.json
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 3
          done
