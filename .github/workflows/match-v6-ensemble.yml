name: MATCH AI - V6.1 Forward Ensemble
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "v6_ensemble.py"
      - ".github/workflows/match-v6-ensemble.yml"
      - "requirements-ai.txt"
  schedule:
    - cron: "33 * * * *"
permissions:
  contents: write
concurrency:
  group: match-ai-v6-ensemble-writer
  cancel-in-progress: false
jobs:
  ensemble:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-ai.txt
      - name: Refresh audited ticks
        env:
          TICK_COUNT: "10000"
        run: python collect_ticks.py
      - name: Run V6.1 forward ensemble
        run: python v6_ensemble.py
      - name: Persist V6 ensemble
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add memory/v6_ensemble_latest.json memory/v6_ensemble_state.json memory/v6_frozen_neural.json memory/v6_frozen_neural.joblib
          git diff --cached --quiet || git commit -m "V6.1 forward ensemble"
          git restore audit.json ticks.json
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 3
          done
