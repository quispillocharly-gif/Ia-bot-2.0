name: MATCH AI - Payout Break-even Probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "payout_probe.py"
      - ".github/workflows/match-payout-probe.yml"
  schedule:
    - cron: "28 * * * *"
permissions:
  contents: write
concurrency:
  group: match-ai-payout-writer
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install websockets==13.1
      - name: Measure current MATCH payout
        run: python payout_probe.py
      - name: Persist payout snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add memory/payout_snapshot.json
          git diff --cached --quiet || git commit -m "Refresh MATCH payout break-even"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 3
          done
