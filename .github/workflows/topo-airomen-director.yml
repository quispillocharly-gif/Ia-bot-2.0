name: TOPO AIROMEN - DIFFER Director
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "topo-airomen/differ_director.py"
      - ".github/workflows/topo-airomen-director.yml"
  workflow_run:
    workflows: ["TOPO AIROMEN - DIFFER Forward Lab", "TOPO AIROMEN - DIFFER V2 Economic Lab"]
    types: [completed]
  schedule:
    - cron: "3,23,43 * * * *"
permissions:
  contents: write
concurrency:
  group: topo-airomen-director
  cancel-in-progress: false
jobs:
  direct:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python topo-airomen/differ_director.py
      - name: Persist director
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp topo-airomen/memory/differ_director_latest.json /tmp/differ_director_latest.json
          cp topo-airomen/memory/differ_live_policy.json /tmp/differ_live_policy.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/differ_director_latest.json topo-airomen/memory/differ_director_latest.json
          cp /tmp/differ_live_policy.json topo-airomen/memory/differ_live_policy.json
          git add topo-airomen/memory/differ_director_latest.json topo-airomen/memory/differ_live_policy.json
          git diff --cached --quiet || git commit -m "TOPO AIROMEN director checkpoint"
          git push
