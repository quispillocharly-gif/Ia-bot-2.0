name: TOPO AIROMEN - DIFFER Director
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["TOPO AIROMEN - DIFFER Forward Lab"]
    types: [completed]
  schedule:
    - cron: "57 * * * *"
permissions:
  contents: write
concurrency:
  group: topo-airomen-director
  cancel-in-progress: false
jobs:
  direct:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python topo-airomen/differ_director.py
      - name: Persist director
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add topo-airomen/memory/differ_director_latest.json
          git diff --cached --quiet || git commit -m "TOPO AIROMEN director checkpoint"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 3
          done
