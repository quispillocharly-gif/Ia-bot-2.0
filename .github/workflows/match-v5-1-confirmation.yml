name: MATCH AI - V5.1 Neural Confirmation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "confirm_v5_1.py"
      - ".github/workflows/match-v5-1-confirmation.yml"
  schedule:
    - cron: "23 * * * *"

permissions:
  contents: write

concurrency:
  group: match-ai-state-writer
  cancel-in-progress: false

jobs:
  confirm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install websockets==13.1 numpy scikit-learn joblib
      - name: Refresh audited ticks
        env:
          TICK_COUNT: "6000"
        run: python collect_ticks.py
      - name: Confirm frozen neural model
        run: python confirm_v5_1.py
      - name: Persist neural confirmation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add memory/v5_1_confirmation_latest.json memory/v5_1_confirmation_state.json memory/neural_v5_frozen.json memory/neural_v5_frozen.joblib
          git diff --cached --quiet || git commit -m "V5.1 neural forward confirmation"
          git restore audit.json ticks.json
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 3
          done