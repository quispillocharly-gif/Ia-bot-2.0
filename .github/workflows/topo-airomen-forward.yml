name: TOPO AIROMEN - DIFFER Forward Lab
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "topo-airomen/differ_forward.py"
      - ".github/workflows/topo-airomen-forward.yml"
  schedule:
    - cron: "12,32,52 * * * *"
permissions:
  contents: write
concurrency:
  group: topo-airomen-forward
  cancel-in-progress: false
jobs:
  forward:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - run: pip install -r topo-airomen/requirements-ai.txt
      - name: Refresh ticks
        env: {TICK_COUNT: "10000"}
        run: python topo-airomen/collect_ticks.py
      - run: python topo-airomen/differ_forward.py
      - name: Persist forward state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add topo-airomen/memory/differ_forward_latest.json topo-airomen/memory/differ_forward_state.json topo-airomen/memory/differ_frozen.json topo-airomen/memory/differ_frozen.joblib
          git diff --cached --quiet || git commit -m "TOPO AIROMEN forward research"
          git restore topo-airomen/ticks.json topo-airomen/audit.json
          for attempt in 1 2 3; do git pull --rebase origin main; if git push; then break; fi; [ "$attempt" -eq 3 ] && exit 1; sleep 3; done
