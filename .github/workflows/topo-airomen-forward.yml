name: TOPO AIROMEN - DIFFER Forward Lab
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["TOPO AIROMEN - DIFFER Neural Research"]
    types: [completed]
  schedule:
    - cron: "12,32,52 * * * *"
permissions:
  contents: write
concurrency:
  group: topo-airomen-forward
  cancel-in-progress: false
jobs:
  forward:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r topo-airomen/requirements-ai.txt
      - name: Refresh DIFFER payout
        run: python topo-airomen/payout_probe_differ.py
      - name: Collect 10000 paginated ticks
        env:
          TICK_COUNT: "10000"
        run: python topo-airomen/collect_ticks.py
      - name: Run forward-only DIFFER shadow lab
        run: python topo-airomen/differ_forward.py
      - name: Persist forward state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add topo-airomen/memory/differ_payout_snapshot.json topo-airomen/memory/differ_forward_latest.json topo-airomen/memory/differ_forward_state.json topo-airomen/memory/differ_frozen.json topo-airomen/memory/differ_frozen.joblib
          git diff --cached --quiet || git commit -m "TOPO AIROMEN forward research"
          git restore topo-airomen/ticks.json topo-airomen/audit.json
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 3
          done
