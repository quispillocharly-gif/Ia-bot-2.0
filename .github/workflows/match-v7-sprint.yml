name: MATCH AI - V7.1 Evidence Sprint Director
on:
  workflow_dispatch:
  schedule:
    - cron: "55 * * * *"
permissions:
  contents: write
concurrency:
  group: match-ai-v7-state-writer
  cancel-in-progress: false
jobs:
  sprint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Evaluate two-week evidence sprint
        run: python v7_sprint.py
      - name: Persist sprint status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add memory/v7_sprint_latest.json
          git diff --cached --quiet || git commit -m "V7.1 evidence sprint checkpoint"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 3
          done
