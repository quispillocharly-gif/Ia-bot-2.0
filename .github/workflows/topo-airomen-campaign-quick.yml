name: TOPO AIROMEN - QUICK 21 WIN TEST

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "topo-airomen/campaign_pattern_search.py"
      - ".github/workflows/topo-airomen-campaign-quick.yml"

permissions:
  contents: write

jobs:
  quick21:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install quick dependencies
        run: pip install numpy==2.5.3 websockets==13.1
      - name: Collect 3200 ticks
        env:
          TICK_COUNT: "3200"
        run: python topo-airomen/collect_ticks.py
      - name: Run quick 21-win campaign search
        env:
          QUICK_MODE: "1"
        run: python topo-airomen/campaign_pattern_search.py
      - name: Persist quick candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add topo-airomen/memory/differ_campaign_21_quick.json
          git diff --cached --quiet || git commit -m "TOPO AIROMEN quick 21-win candidate"
          rm -f topo-airomen/ticks.json topo-airomen/audit.json
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 2
          done
