name: MATCH AI - V5 Neural Lab

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "neural_v5.py"
      - ".github/workflows/match-v5-neural.yml"
  schedule:
    - cron: "13 * * * *"

permissions:
  contents: write

concurrency:
  group: match-ai-state-writer
  cancel-in-progress: false

jobs:
  neural:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-ai.txt
      - name: Refresh audited ticks
        env:
          TICK_COUNT: "10000"
        run: python collect_ticks.py
      - name: Train autonomous neural evolution lab
        run: python neural_v5.py
      - name: Persist neural research
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add memory/neural_v5_latest.json memory/neural_v5_state.json memory/neural_v5_candidate.json memory/neural_v5_candidate.joblib
          git diff --cached --quiet || git commit -m "V5.2 autonomous neural evolution"
          git restore audit.json ticks.json
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 3
          done
