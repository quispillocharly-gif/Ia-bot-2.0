name: MATCH AI - V4.1 Confirmation
on:
  workflow_dispatch:
  schedule:
    - cron: "53 * * * *"
permissions:
  contents: write
concurrency:
  group: match-ai-state-writer
  cancel-in-progress: false
jobs:
  confirm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install websockets==13.1
      - name: Refresh audited ticks
        run: python collect_ticks.py
      - name: Forward-only confirmation
        run: python confirm_v4_1.py
      - name: Persist confirmation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit.json ticks.json memory/
          git diff --cached --quiet || git commit -m "V4.1 forward confirmation"
          git push
