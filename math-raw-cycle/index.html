<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Math Raw Cycle</title><style>body{margin:0;padding:18px;font-family:system-ui;background:#050811;color:#eefaff}.w{max-width:850px;margin:auto}.hero,.c{border:1px solid #18d7c3;border-radius:18px;padding:15px;margin:10px 0;background:#0b1720}.hero{background:linear-gradient(135deg,#08272c,#151033)}h1{margin:5px 0}.tag{letter-spacing:2px;color:#55ffe5;font-size:12px}.g{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.k{padding:12px;background:#071019;border-radius:10px}.k b{display:block;font-size:24px;color:#7fffe9}button{padding:12px 18px;border:1px solid #5dffe8;border-radius:10px;background:#102b31;color:white;font-weight:800}.muted{color:#91aaa9}#used{word-break:break-word}#log{height:180px;overflow:auto;white-space:pre-wrap;font:12px monospace}</style></head><body><div class="w"><div class="hero"><div class="tag">PROYECTO INDEPENDIENTE</div><h1>MATH RAW CYCLE</h1><div class="muted">Sin predicción · sin remapeo · el RAW matemático debe aparecer por sí mismo</div></div><div class="c"><button id="start">INICIAR</button> <button id="stop">STOP</button> <b id="status">DETENIDO</b></div><div class="g"><div class="k">TICK REAL<b id="tick">—</b></div><div class="k">FÓRMULA<b id="formula">—</b></div><div class="k">RAW MATEMÁTICO<b id="raw">—</b></div><div class="k">CICLO<b id="cycle">1</b></div><div class="k">ACEPTADOS<b id="accepted">0/10</b></div><div class="k">TICKS ESPERADOS<b id="wait">0</b></div></div><div class="c"><b>USADOS EN ESTE CICLO</b><div id="used" class="muted">NINGUNO</div></div><div class="c"><b id="decision">SIN DECISIÓN</b><div id="reason" class="muted">Esperando inicio</div></div><div class="c"><div id="log"></div></div></div><script src="app.js"></script></body></html>
