<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RANDOMNESS LAB</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#071522;color:#eef7ff;font-family:system-ui,-apple-system,sans-serif}.wrap{max-width:760px;margin:auto;padding:18px}.card{background:#0d2132;border:1px solid #28465d;border-radius:22px;padding:20px;margin:14px 0}.title{font-size:27px;font-weight:900}.sub,.muted{color:#9db3c5}.status{font-weight:800;margin-top:10px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.metric b{display:block;font-size:36px}.ok{color:#55e3a1}.bad{color:#ff788b}.decision{font-size:32px;font-weight:900;line-height:1.15}.read{font-size:18px;color:#a9bdcc;line-height:1.35}.models{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.model{background:#081a29;border-radius:14px;padding:10px;text-align:center;min-width:0}.model b{display:block;font-size:18px}.model small{color:#8ea6b8}.actions{display:flex;gap:10px}.actions button{flex:1;border:0;border-radius:14px;padding:15px;font-size:17px;font-weight:900}.go{background:#55e3a1;color:#052014}.stop{background:#ff788b;color:#2a0710}.log{white-space:pre-wrap;color:#a9bdcc;max-height:230px;overflow:auto}.bar{height:10px;background:#071522;border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;background:#55e3a1;width:0}.wide{grid-column:1/-1}@media(max-width:520px){.models{grid-template-columns:repeat(3,1fr)}.decision{font-size:28px}.card{padding:16px}.wrap{padding:10px}}
</style></head><body><main class="wrap">
<div class="card"><div class="title">RANDOMNESS LAB · DEMO</div><div class="sub">TORNEO 100 + RANDOM · DIGITDIFF · R_75</div><div id="status" class="status">Conectando ticks...</div></div>
<div class="card"><div class="grid">
<div class="metric"><span class="muted">P&L neto</span><b id="pnl">+$0.00</b></div><div class="metric"><span class="muted">Stake actual</span><b id="stake">$0.50</b></div>
<div class="metric"><span class="muted">WIN</span><b id="wins" class="ok">0</b></div><div class="metric"><span class="muted">MATCH</span><b id="loss" class="bad">0</b></div>
<div class="metric"><span class="muted">Operaciones</span><b id="trades">0</b></div><div class="metric"><span class="muted">Sesiones +$5</span><b id="sessions" class="ok">0</b></div>
<div class="wide"><span class="muted">Meta +$5</span><div class="bar"><i id="progress"></i></div></div>
</div></div>
<div class="card"><div class="grid"><div><span class="muted">DECISIÓN</span><div id="decision" class="decision">INVESTIGANDO</div></div><div><span class="muted">LECTURA</span><div id="reason" class="read">Reuniendo evidencia...</div></div></div></div>
<div class="card"><div class="muted">GEN 2 selectiva · mejores MATCH / señales</div><div id="models" class="models"></div></div>
<div class="card actions"><button id="go" class="go">INICIAR SESIÓN</button><button id="stop" class="stop">STOP</button></div>
<div class="card"><b>REGISTRO</b><div id="log" class="log">Esperando datos...</div></div>
</main><script>
const $=id=>document.getElementById(id);
const BASE=.50,TARGET=5;
const FREQ_WINDOWS=Array.from({length:40},(_,i)=>10+i*5);
const TRANS_WINDOWS=Array.from({length:30},(_,i)=>20+i*10);
const ANTI_WINDOWS=Array.from({length:20},(_,i)=>15+i*5);
const BLEND_WEIGHTS=Array.from({length:10},(_,i)=>{const a=.15+.025*i,b=.35-.015*i,c=.15+.01*i,d=1-a-b-c;return [a,b,c,d]});
const MODEL_NAMES=[...FREQ_WINDOWS.map(n=>'F'+n),...TRANS_WINDOWS.map(n=>'T'+n),...ANTI_WINDOWS.map(n=>'A'+n),...BLEND_WEIGHTS.map((_,i)=>'B'+(i+1)),'RANDOM'];
let seq=[],running=false,pnl=0,stake=BASE,wins=0,losses=0,sessions=0,pending=null,lastEpoch=0,nextVirtual=null,nextSelective=null;
const score=Object.fromEntries(MODEL_NAMES.map(n=>[n,{m:0,n:0,hm:0,hn:0}]));
const SELECTIVE=Array.from({length:40},(_,i)=>({name:'S'+(i+1),win:20+(i%10)*10,gap:.015+Math.floor(i/10)*.01}));
const selectiveScore=Object.fromEntries(SELECTIVE.map(x=>[x.name,{m:0,n:0}]));
function log(x){$('log').textContent=x+'\n'+$('log').textContent.slice(0,4000)}
function stats(){const n=wins+losses;$('pnl').textContent=(pnl>=0?'+':'')+'$'+pnl.toFixed(2);$('stake').textContent='$'+stake.toFixed(2);$('wins').textContent=wins;$('loss').textContent=losses;$('trades').textContent=n;$('sessions').textContent=sessions;$('progress').style.width=Math.max(0,Math.min(100,pnl/TARGET*100))+'%'}
function minPick(c){const mn=Math.min(...c),a=c.map((x,d)=>({x,d})).filter(z=>z.x===mn);return a[Math.floor(Math.random()*a.length)].d}
function freq(arr,n){const c=Array(10).fill(0);arr.slice(-n).forEach(d=>c[d]++);return minPick(c)}
function trans(arr,n){const z=arr.slice(-n),last=z[z.length-1],c=Array(10).fill(1);for(let i=1;i<z.length;i++)if(z[i-1]===last)c[z[i]]++;return minPick(c)}
function anti(arr,n){const c=Array(10).fill(0);arr.slice(-n).forEach(d=>c[d]++);c[arr[arr.length-1]]++;return minPick(c)}
function blend(arr,w){const z=arr.slice(-180),last=z[z.length-1],c20=Array(10).fill(0),c50=Array(10).fill(0),c100=Array(10).fill(0),t=Array(10).fill(1);z.slice(-20).forEach(d=>c20[d]++);z.slice(-50).forEach(d=>c50[d]++);z.slice(-100).forEach(d=>c100[d]++);for(let i=1;i<z.length;i++)if(z[i-1]===last)t[z[i]]++;const ts=t.reduce((a,b)=>a+b,0),r=Array(10).fill(0);for(let d=0;d<10;d++)r[d]=w[0]*(c20[d]+1)/30+w[1]*(c50[d]+1)/60+w[2]*(c100[d]+1)/110+w[3]*t[d]/ts;return minPick(r)}
function predictions(arr){const o={};FREQ_WINDOWS.forEach(n=>o['F'+n]=freq(arr,n));TRANS_WINDOWS.forEach(n=>o['T'+n]=trans(arr,n));ANTI_WINDOWS.forEach(n=>o['A'+n]=anti(arr,n));BLEND_WEIGHTS.forEach((w,i)=>o['B'+(i+1)]=blend(arr,w));o.RANDOM=Math.floor(Math.random()*10);return o}
function selectivePredictions(arr){const out={};for(const cfg of SELECTIVE){const z=arr.slice(-cfg.win),c=Array(10).fill(0);z.forEach(d=>c[d]++);const rates=c.map(x=>x/z.length),ord=rates.map((r,d)=>({r,d})).sort((a,b)=>a.r-b.r);if(ord[1].r-ord[0].r>=cfg.gap)out[cfg.name]=ord[0].d}return out}
function recordSelective(actual){if(!nextSelective)return;for(const [name,pick] of Object.entries(nextSelective)){const q=selectiveScore[name];q.n++;if(pick===actual)q.m++}}
function recordVirtual(actual){if(!nextVirtual)return;for(const [name,pick] of Object.entries(nextVirtual)){const s=score[name];s.n++;if(pick===actual)s.m++;if(s.n%3===0){s.hn++;if(pick===actual)s.hm++}}}
function evaluate(){
 const random=score.RANDOM.n?score.RANDOM.m/score.RANDOM.n:.10;
 const control=MODEL_NAMES.filter(n=>n!=='RANDOM').map(name=>{const q=score[name];return {name,n:q.n,rate:q.n?q.m/q.n:1,hn:q.hn,hold:q.hn?q.hm/q.hn:1}}).filter(x=>x.n>=400&&x.hn>=130).sort((a,b)=>(a.rate+a.hold)-(b.rate+b.hold))[0];
 const sel=SELECTIVE.map(x=>{const q=selectiveScore[x.name];return {name:x.name,n:q.n,rate:q.n?q.m/q.n:1}}).filter(x=>x.n>=500).sort((a,b)=>a.rate-b.rate);
 const champ=sel[0],valid=!!champ&&champ.n>=1000&&champ.rate<.085;
 $('models').innerHTML=(sel.length?sel.slice(0,15):SELECTIVE.slice(0,15).map(x=>({name:x.name,n:selectiveScore[x.name].n,rate:selectiveScore[x.name].n?selectiveScore[x.name].m/selectiveScore[x.name].n:0}))).map(x=>'<div class="model">'+x.name+'<b>'+(x.n?(100*x.rate).toFixed(2):'–')+'%</b><small>'+x.n+'</small></div>').join('');
 if(!champ){$('decision').textContent='GEN 2 · INVESTIGANDO';$('reason').textContent='Buscando señales selectivas · equilibrio MATCH < 9.09%';return {buy:false}}
 const picks=selectivePredictions(seq),digit=picks[champ.name];
 const ready=valid&&digit!==undefined;
 $('decision').textContent=ready?'COMPRAR DIFFER '+digit:'GEN 2 · ESPERANDO CONDICIÓN';
 $('reason').textContent='GEN 2 · '+champ.name+' MATCH '+(champ.rate*100).toFixed(2)+'% · señales '+champ.n+' · control '+(control?(control.rate*100).toFixed(2)+'%':'–')+' · RANDOM '+(random*100).toFixed(2)+'%';
 return {buy:ready,digit}
}
function settle(actual){if(!pending)return;const won=actual!==pending.digit;if(won){const profit=pending.stake*.10;pnl+=profit;stake=pending.stake+profit;wins++;log('WIN · DIFFER '+pending.digit+' · +$'+profit.toFixed(2))}else{pnl-=pending.stake;stake=BASE;losses++;log('MATCH · D'+pending.digit+' · -$'+pending.stake.toFixed(2)+' · vuelve $0.50')}pending=null;stats();if(pnl>=TARGET){sessions++;running=false;stats();$('status').textContent='META +$5 ALCANZADA · detenida';log('OBJETIVO +$5 ALCANZADO')}}
function processDigit(d){if(pending){settle(d);return}if(!running||seq.length<300)return;const q=evaluate();if(!q.buy)return;pending={digit:q.digit,stake};$('status').textContent='OPERACIÓN SIMULADA ABIERTA · DIFFER '+q.digit+' · $'+stake.toFixed(2);log('COMPRA SIMULADA · DIFFER '+q.digit+' · $'+stake.toFixed(2)+' · liquida próximo tick')}
function onTick(d){recordVirtual(d);recordSelective(d);seq.push(d);if(seq.length>1800)seq.shift();if(seq.length>=200){nextVirtual=predictions(seq);nextSelective=selectivePredictions(seq)}evaluate();processDigit(d)}
function connect(){const ws=new WebSocket('wss://api.derivws.com/trading/v1/options/ws/public');ws.onopen=()=>ws.send(JSON.stringify({ticks_history:'R_75',count:700,end:'latest',style:'ticks',req_id:1}));ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.history&&m.history.prices){const p=Number(m.pip_size||4);seq=m.history.prices.map(x=>Number(Number(x).toFixed(p).slice(-1)));nextVirtual=predictions(seq);nextSelective=selectivePredictions(seq);evaluate();ws.send(JSON.stringify({ticks:'R_75',subscribe:1,req_id:2}));$('status').textContent='Ticks R_75 conectados · listo'}else if(m.tick){const ep=Number(m.tick.epoch);if(ep===lastEpoch)return;lastEpoch=ep;const p=Number(m.tick.pip_size||4),d=Number(Number(m.tick.quote).toFixed(p).slice(-1));onTick(d)}};ws.onclose=()=>{$('status').textContent='Feed desconectado';running=false};ws.onerror=()=>{$('status').textContent='Error de conexión al feed'}}
$('go').onclick=()=>{pnl=0;stake=BASE;wins=0;losses=0;pending=null;running=true;stats();$('status').textContent='SESIÓN ACTIVA · torneo continúa aprendiendo';log('SESIÓN INICIADA · base $0.50 · meta +$5')};
$('stop').onclick=()=>{running=false;pending=null;$('status').textContent='Sesión detenida manualmente';log('STOP MANUAL')};
stats();connect();
</script></body></html>
