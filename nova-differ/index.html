<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOVA DIFFER</title><style>*{box-sizing:border-box}body{margin:0;background:#040711;color:#f4f8ff;font-family:system-ui;padding:16px}.w{max-width:920px;margin:auto}.hero,.panel{border:1px solid #7a5cff;border-radius:22px;background:#0a1020;padding:16px;margin:11px 0;box-shadow:0 0 28px #301b6638}.hero{background:linear-gradient(135deg,#071d35,#20103b)}.ey{color:#7dffe5;letter-spacing:3px;font-size:11px}h1{font-size:38px;margin:5px 0}.sub{color:#9faec5}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{background:#070d18;border:1px solid #18243b;border-radius:16px;padding:14px}.card span{color:#aab7ca}.card b{display:block;font-size:27px;color:#70ffe1;margin-top:4px}.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}button,select,input{background:#111a2c;color:white;border:1px solid #735cff;border-radius:12px;padding:13px;font-weight:800}button{min-width:110px}.go{border-color:#53ffd5}.stop{border-color:#ff5f87}.status{font-weight:900;color:#70ffe1}.trade{font-size:20px;font-weight:900}.real input{display:block;width:100%;margin:8px 0}.log{height:190px;overflow:auto;white-space:pre-wrap;font:12px monospace;color:#b9c9dc}@media(min-width:760px){.grid{grid-template-columns:repeat(4,1fr)}}</style></head><body><div class="w"><div class="hero"><div class="ey">NUEVO PROYECTO · MOTOR INDEPENDIENTE</div><h1>NOVA DIFFER</h1><div class="sub">1 tick · progresión · objetivo neto +$3 · SIM / REAL</div></div><div class="panel controls"><select id="mode"><option>SIM</option><option>REAL</option></select><button class="go" id="start">INICIAR</button><button class="stop" id="stop">STOP</button><span class="status" id="status">CONECTANDO…</span></div><div class="grid"><div class="card"><span>PNL</span><b id="pnl">+$0.00</b></div><div class="card"><span>STAKE</span><b id="stake">$1.00</b></div><div class="card"><span>WIN</s
